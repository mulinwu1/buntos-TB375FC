name: TB375FC boot images

# 原样跑项目的 mkinitramfs.sh + mkimages.sh 生成 LK 读的 boot 四件套。
# 在 Debian 13 (trixie) 容器里跑 —— 作者的 build VM 就是 Debian 13, mkbootimg 是
# Debian 原生 C++ 版 (支持 vendor_boot); Ubuntu 的 mkbootimg 是缺 gki 模块的 Python 版。
# 输入: release tb375fc-prebuilt-v1 里的内核 deb (含 vmlinuz + DTB + modules)。
# cmdline 指向 airoot (btrfs)。dtbo 按作者文档前面填 0 跳过 LK 签名检查。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot:
    name: Build boot images
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 下载并解包内核 deb
        run: |
          gh release download tb375fc-prebuilt-v1 --repo mulinwu1/buntos-TB375FC \
            --pattern 'linux-image-*.deb' --dir /tmp/kdeb
          mkdir -p /tmp/kroot
          dpkg-deb -x /tmp/kdeb/linux-image-*.deb /tmp/kroot
          echo "=== vmlinuz ==="; find /tmp/kroot/boot -name 'vmlinuz*' -ls
          echo "=== dtb ==="; find /tmp/kroot/usr/lib/linux-image-* -name 'mt6897-lenovo-tb375fc.dtb' -ls
          VMLINUZ=$(find /tmp/kroot/boot -name 'vmlinuz*' | head -1)
          DTB=$(find /tmp/kroot/usr/lib/linux-image-* -name 'mt6897-lenovo-tb375fc.dtb' | head -1)
          cp "$VMLINUZ" /tmp/kernel-Image
          cp "$DTB" /tmp/board.dtb
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Debian 13 容器里生成 boot
        id: images
        run: |
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v /tmp/kroot:/kroot:ro \
            -v /tmp/kernel-Image:/kernel-Image:ro \
            -v /tmp/board.dtb:/board.dtb:ro \
            -v /tmp/boot-images:/out \
            debian:trixie bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                mkbootimg lz4 cpio device-tree-compiler busybox-static python3 \
                kmod zstd curl ca-certificates xz-utils >/dev/null
              echo "=== tools ==="
              which mkbootimg lz4 dtc cpio busybox xz
              mkbootimg --help 2>&1 || true
              mkdir -p /root/buntos-build/tb375fc/images
              echo "=== mkinitramfs ==="
              /repo/bsp/lenovo-tb375fc/initramfs/mkinitramfs.sh \
                --modules /kroot \
                --out /root/buntos-build/tb375fc/images/initramfs.cpio.lz4
              ls -lh /root/buntos-build/tb375fc/images/initramfs.cpio.lz4
              echo "=== mkimages ==="
              /repo/bsp/lenovo-tb375fc/boot/mkimages.sh \
                --kernel /kernel-Image \
                --dtb /board.dtb \
                --initramfs /root/buntos-build/tb375fc/images/initramfs.cpio.lz4 \
                --cmdline "console=ttyS0,921600n8 console=tty0 earlycon clk_ignore_unused pd_ignore_unused regulator_ignore_unused root=PARTLABEL=airoot rootfstype=btrfs rw systemd.firstboot=no buntos.usbdebug=1" \
                --out /out
              echo "=== done ==="
              ls -lh /out
            ' 2>&1 | tee "$RUNNER_TEMP/boot-build.log"
          rc=${PIPESTATUS[0]}
          set -e
          tail -50 "$RUNNER_TEMP/boot-build.log"
          mkdir -p "$RUNNER_TEMP/diag"; cp "$RUNNER_TEMP/boot-build.log" "$RUNNER_TEMP/diag/"
          exit "$rc"

      - name: dtbo 前面填 0 (LK workaround)
        # 作者文档: LK 即使解锁也要求带 DT 表的 dtbo 有签名, 前面填 0 跳过
        run: |
          D=/tmp/boot-images/dtbo.img
          sz=$(stat -c%s "$D")
          { head -c 4096 /dev/zero; cat "$D"; } > "$D.zeroed"
          mv "$D.zeroed" "$D"
          echo "dtbo zero-padded: $(stat -c%s "$D") bytes (was $sz)"
          for f in /tmp/boot-images/*.img; do ls -lh "$f"; done

      - name: Upload boot images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tb375fc-boot-images
          path: /tmp/boot-images/*.img
          retention-days: 30

      - name: Upload boot diag
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-build-diag
          path: ${{ runner.temp }}/diag/boot-build.log
          retention-days: 5
          if-no-files-found: warn
