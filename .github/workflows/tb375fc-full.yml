name: TB375FC full minimal Linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Kernel + boot images + minimal rootfs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 480

    env:
      MKOSI_FORCE_USERNS_FALLBACK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison bc libssl-dev libncurses-dev \
            libelf-dev dwarves rsync curl xz-utils zstd lz4 cpio \
            gzip python3 kmod file wget git busybox-static \
            unzip squashfs-tools openssl
          echo "=== runner ==="; uname -a; nproc; free -h; df -h .

      - name: Restore kernel cache
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/buntos-build/tb375fc
          key: tb375fc-kernel-${{ hashFiles('kernel/tb375fc/**') }}

      - name: Build kernel
        timeout-minutes: 180
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: kernel/tb375fc/build.sh all

      - name: Check kernel
        run: |
          B="$HOME/buntos-build/tb375fc"
          ls -lh "$B/out/arch/arm64/boot/Image"
          ls -lh "$B/out/arch/arm64/boot/dts/mediatek/mt6897-lenovo-tb375fc.dtb"
          du -sh "$B/modules"

      - name: Install boot tools
        run: |
          sudo apt-get install -y --no-install-recommends mkbootimg 2>/dev/null || true
          command -v mkbootimg || echo "mkbootimg missing"
          command -v busybox || echo "busybox missing"
          # Debian/Ubuntu mkbootimg 34.0.4 packaging bug: gki module missing.
          # Fetch the AOSP gki module + avbtool it imports.
          AOSP="https://android.googlesource.com/platform/system/tools/mkbootimg/+/refs/heads/main"
          sudo mkdir -p /usr/local/lib/android-tools/gki
          sudo touch /usr/local/lib/android-tools/gki/__init__.py
          curl -sL "$AOSP/gki/generate_gki_certificate.py?format=TEXT" | base64 -d 2>/dev/null | sudo tee /usr/local/lib/android-tools/gki/generate_gki_certificate.py > /dev/null
          curl -sL "https://android.googlesource.com/platform/external/avb/+/refs/heads/main/avbtool.py?format=TEXT" | base64 -d 2>/dev/null | sudo tee /usr/local/lib/android-tools/avbtool.py > /dev/null
          sudo chmod +x /usr/local/lib/android-tools/avbtool.py
          echo "PYTHONPATH=/usr/local/lib/android-tools" >> "$GITHUB_ENV"
          PYTHONPATH=/usr/local/lib/android-tools python3 -c "from gki.generate_gki_certificate import generate_gki_certificate; print('gki OK')"

      - name: Generate SSH key
        run: |
          mkdir -p "$HOME/buntos-build/ssh"
          ssh-keygen -t ed25519 -N '' -f "$HOME/buntos-build/ssh/id_ed25519"
          cat "$HOME/buntos-build/ssh/id_ed25519.pub"

      - name: Build initramfs
        timeout-minutes: 30
        run: |
          B="$HOME/buntos-build/tb375fc"
          bsp/lenovo-tb375fc/initramfs/mkinitramfs.sh --modules "$B/modules"
          ls -lh "$B/images/initramfs.cpio.lz4"

      - name: Build boot images
        timeout-minutes: 30
        run: |
          B="$HOME/buntos-build/tb375fc"
          K="$B/out/arch/arm64/boot"
          CMDLINE="console=ttyS0,921600n8 console=tty0 earlycon clk_ignore_unused pd_ignore_unused regulator_ignore_unused root=PARTLABEL=airoot rootfstype=ext4 rw systemd.firstboot=no buntos.usbdebug=1 systemd.set_credential_binary=ssh.authorized_keys.root:$(base64 -w0 "$HOME/buntos-build/ssh/id_ed25519.pub")"
          bsp/lenovo-tb375fc/boot/mkimages.sh \
            --kernel "$K/Image" \
            --dtb "$K/dts/mediatek/mt6897-lenovo-tb375fc.dtb" \
            --initramfs "$B/images/initramfs.cpio.lz4" \
            --cmdline "$CMDLINE"
          ls -lh "$B/images/"*.img
          cat "$B/images/images.txt"

      - name: Install mkosi
        timeout-minutes: 20
        run: |
          sudo sysctl --ignore --write kernel.apparmor_restrict_unprivileged_unconfined=0
          sudo sysctl --ignore --write kernel.apparmor_restrict_unprivileged_userns=0
          python3 -m pip install --break-system-packages pipx
          python3 -m pipx install "git+https://github.com/systemd/mkosi.git@$(sed -n 's/^MKOSI_VERSION=//p' tools/devvm/setup.sh)"
          echo "$(python3 -m pipx environment --value PIPX_BIN_DIR)" >> "$GITHUB_PATH"

      - name: Build minimal rootfs
        timeout-minutes: 120
        run: |
          O="$HOME/buntos-build/tb375fc/rootfs-out"
          R="$PWD/minimal-rootfs"
          mkdir -p "$R"
          cat > "$R/mkosi.conf" <<'MOKONF'
          [Distribution]
          Distribution=debian
          Release=trixie

          [Output]
          Format=disk
          ImageId=airoot

          [Content]
          Bootable=no
          Bootloader=none
          Packages=openssh-server systemd-sysv iproute2 iputils-ping less vim-tiny procps
          MOKONF
          sudo env "PATH=$PATH" "PYTHONPATH=$PYTHONPATH" mkosi -C "$R" --output-directory="$O" -f build
          sudo chown -R "$(id -u):$(id -g)" "$O"
          ls -lh "$O"

      - name: Package artifacts
        run: |
          S="$HOME/buntos-build/artifacts"
          mkdir -p "$S"
          B="$HOME/buntos-build/tb375fc"
          cp "$B/images/boot.img" "$S/"
          cp "$B/images/init_boot.img" "$S/"
          cp "$B/images/vendor_boot.img" "$S/"
          cp "$B/images/dtbo.img" "$S/"
          cp "$B/images/images.txt" "$S/"
          find "$HOME/buntos-build/tb375fc/rootfs-out" -name '*.raw' -exec cp {} "$S/" \; 2>/dev/null || true
          cp "$HOME/buntos-build/ssh/id_ed25519" "$S/ssh_private_key" 2>/dev/null || true
          cp "$HOME/buntos-build/ssh/id_ed25519.pub" "$S/" 2>/dev/null || true
          echo "=== artifacts ==="; ls -lh "$S"

      - name: Upload all
        uses: actions/upload-artifact@v4
        with:
          name: tb375fc-flash-package
          path: /home/runner/buntos-build/artifacts/*
          retention-days: 30
